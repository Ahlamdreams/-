<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الجرس المدرسي الذكي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- شاشة البدء: المتصفح يحتاج ضغطة لتفعيل الصوت -->
  <div id="startOverlay" hidden>
    <h1>🔔 الجرس المدرسي الذكي</h1>
    <p>اضغط الزر لتفعيل الصوت وبدء التشغيل.<br>
      (عند التشغيل عبر ملف <b>start-bell.bat</b> تختفي هذه الشاشة تلقائياً)</p>
    <button class="btn-big" id="startBtn">▶ بدء التشغيل</button>
  </div>

  <!-- ===================== شاشة العرض ===================== -->
  <main id="display">
    <header class="topbar">
      <div class="brand">
        <img id="logo" alt="" hidden>
        <div>
          <div class="name" id="schoolName"></div>
          <div class="sub" id="schoolSub"></div>
        </div>
      </div>
      <div class="clock"><div class="time" id="clock">--:--</div></div>
      <div class="dates">
        <div><span class="day" id="dayName"></span> <span class="week" id="weekLabel"></span></div>
        <div id="gregDate"></div>
        <div class="hijri" id="hijriDate"></div>
      </div>
    </header>

    <section class="content" id="content">
      <div class="stage" id="stage"></div>
      <aside class="side">
        <div class="card now-card">
          <h3 id="nowLabel">الآن</h3>
          <div class="now-title" id="nowTitle">—</div>
          <div class="now-range" id="nowRange"></div>
          <div class="now-count" id="nowCount"></div>
          <div class="progress"><div id="nowProg"></div></div>
        </div>
        <div class="card">
          <h3>التالي</h3>
          <div class="next-line" id="nextLine">—</div>
        </div>
        <div class="card grow" id="dutyCard">
          <h3>🛡️ المناوبة <span class="pill" id="dutySlot"></span></h3>
          <ul class="list scroller" id="dutyList"></ul>
        </div>
        <div class="card grow" id="subsCard">
          <h3>🔁 حصص الاحتياط اليوم <span class="pill" id="subsCount"></span></h3>
          <ul class="list scroller" id="subsList"></ul>
        </div>
      </aside>
    </section>

    <footer class="ticker" id="ticker">
      <div class="ticker-label" id="tickerLabel">أخبار المدرسة</div>
      <div class="ticker-track"><div class="ticker-inner" id="tickerInner"></div></div>
    </footer>

    <div class="controls">
      <button id="cSettings" title="الإعدادات (S)">⚙️</button>
      <button id="cFull" title="ملء الشاشة (F)">⛶</button>
      <button id="cBell" title="جرس يدوي الآن (B)">🔔</button>
      <button id="cMute" title="إيقاف/تشغيل الجرس التلقائي (M)">🔊</button>
      <button id="cStop" title="إيقاف الصوت الجاري (Esc)">⏹</button>
      <button id="cNext" title="الشريحة التالية (→)">⏭</button>
    </div>
    <div class="status-flag" id="mutedFlag" hidden>الجرس التلقائي متوقف</div>
    <div class="banner" id="banner" hidden><div class="box"><div class="icon">🔔</div><div class="msg" id="bannerMsg"></div></div></div>
  </main>

  <!-- ===================== الإعدادات ===================== -->
  <div id="settings" hidden>
    <div class="set-head">
      <h2>⚙️ إعدادات الجرس المدرسي</h2>
      <nav class="tabs" id="tabs">
        <button data-tab="general">عام</button>
        <button data-tab="schedule">الجداول والتوقيت</button>
        <button data-tab="sounds">الأصوات والإعلانات</button>
        <button data-tab="reminders">تنبيهات إضافية</button>
        <button data-tab="slides">العرض والشريط</button>
        <button data-tab="duty">المناوبة</button>
        <button data-tab="subs">الاحتياط</button>
        <button data-tab="backup">النسخ الاحتياطي</button>
      </nav>
      <button class="btn pri" id="closeSettings">✓ عودة للعرض</button>
    </div>
    <div class="set-body" id="setBody"></div>
  </div>

  <input type="file" id="filePicker" hidden>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="lib/pdf.worker.min.js"></script>
  <script src="lib/pdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
