<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>دليل أولياء الأمور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Tajawal,sans-serif;background:#eef0f8}
.bg{position:absolute;inset:0;width:1080px;height:1920px}
.veil{position:absolute;left:0;right:0;top:452px;height:1205px;
 background:radial-gradient(ellipse at 50% 40%,#fbfbff 0%,#f1f1fa 60%,#e9ecf7 100%);
 -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 34px,#000 calc(100% - 40px),transparent 100%)}
.title{position:absolute;top:478px;left:0;right:0;text-align:center}
.title h1{font-family:'Reem Kufi',sans-serif;font-size:66px;color:#6a1b78;line-height:1.1}
.title h1 span{color:#1f8fa3}
.title .sub{margin-top:8px;font-size:31px;font-weight:800;color:#3b6f8a}
.title .date{display:inline-block;margin-top:14px;padding:8px 26px;border-radius:99px;background:linear-gradient(90deg,#7b2f8f,#2aa3b4);color:#fff;font-size:25px;font-weight:800;box-shadow:0 6px 16px rgba(106,27,120,.25)}
.mapcard{position:absolute;top:700px;left:50%;transform:translateX(-50%);background:#fff;padding:12px;border-radius:26px;box-shadow:0 18px 40px rgba(60,40,100,.22);border:2px solid #d9c6ea}
.mapcard img{display:block;height:875px;border-radius:16px}
.hint{position:absolute;top:1628px;left:0;right:0;text-align:center;font-size:21px;font-weight:700;color:#6a1b78}
</style></head><body>
<img class="bg" src="template.png" alt="">
<div class="veil"></div>
<div class="title">
 <h1>دليلكم إلى <span>طاولات المعلمات</span></h1>
 <div class="sub">اللقاء التربوي بين أولياء الأمور والهيئة التعليمية</div>
 <div class="date">الخميس ١٩ نوفمبر ٢٠٢٦م · من ٢:٣٠ حتى ٤:٠٠ مساءً</div>
</div>
<div class="mapcard"><img src="map-body.png" alt="خريطة توزيع طاولات المعلمات"></div>
</body></html>
